[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atlas-research"
version = "0.1.0"
description = "Artifact-first offline research and evaluation plane for AtlasRepo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "atlas-research contributors" }]
keywords = ["evaluation", "ranking", "reproducibility", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Arnon-hs/atlas-research"
Repository = "https://github.com/Arnon-hs/atlas-research"
Issues = "https://github.com/Arnon-hs/atlas-research/issues"

[project.scripts]
atlas-research = "atlas_research.cli:main"

[dependency-groups]
dev = [
  "build>=1.5.0,<2",
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_research"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["atlas_research"]
omit = [
  "*/atlas_research/__main__.py",
  "*/atlas_research/_worker_child.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
