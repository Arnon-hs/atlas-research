          cleanup_ids = {int(fields[1]) for fields in cleanup}
          cleanup_names = {fields[2] for fields in cleanup}
          if any(asset.get("id") in cleanup_ids or asset.get("name") in cleanup_names for asset in assets):
              raise SystemExit("starter release asset still exists after bounded cleanup")
