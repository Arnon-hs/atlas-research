          subject-name: ${{ steps.identity.outputs.image_name }}
          subject-digest: ${{ steps.image_digest.outputs.digest }}
          push-to-registry: true

      - name: Verify the newly created exact GitHub image attestation
        if: steps.image_state.outputs.exists != 'true' && steps.identity.outputs.release_state != 'published_exact'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image_digest.outputs.digest }}
          IMAGE_NAME: ${{ steps.identity.outputs.image_name }}
        shell: bash
        run: |
          set -euo pipefail

          registry_json="$(mktemp "${RUNNER_TEMP:?}/atlas-registry-attestation.XXXXXX")"
          github_json="$(mktemp "${RUNNER_TEMP:?}/atlas-github-attestation.XXXXXX")"
          trap 'rm -f "$registry_json" "$github_json"' EXIT HUP INT TERM
          verify_attestation() {
            local output="$1"
            shift
            gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
              "$@" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --format json > "$output"
