          import hashlib
          import json
          import pathlib
          import sys

          pages = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("draft release asset pagination response is invalid after cleanup")
          assets = [asset for page in pages for asset in page]
          if any(not isinstance(asset, dict) for asset in assets):
              raise SystemExit("draft release asset response is invalid after cleanup")
          records = [
              line.split("\t")
              for line in pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          ]
          if any(
              not fields
              or fields[0] not in {"delete", "upload"}
              or (fields[0] == "delete" and len(fields) != 3)
              or (fields[0] == "upload" and len(fields) != 2)
              for fields in records
          ):
              raise SystemExit("release asset recovery plan is invalid")
