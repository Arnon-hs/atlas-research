              )
              for path in entries
          }
          if set(local) != expected_names:
              raise SystemExit(f"local release asset set is not exact: {sorted(local)!r}")

          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("immutable release assets are not a list")
          remote_names = [asset.get("name") for asset in assets]
          if len(remote_names) != len(set(remote_names)):
              raise SystemExit("immutable release contains duplicate asset names")
          if any(asset.get("state") != "uploaded" for asset in assets):
