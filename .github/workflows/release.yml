              raise SystemExit("promoted version tag does not resolve to the attested digest")
          PY

      - name: Record the exact release image identity
        env:
          IMAGE_DIGEST: ${{ steps.image_digest.outputs.digest }}
          IMAGE_NAME: ${{ steps.identity.outputs.image_name }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx returned an invalid image digest" >&2
            exit 66
          fi
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" \
            > "dist/atlasrepo-research-${VERSION}-image-digest.txt"

      - name: Create and verify release checksums
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum \
            "atlasrepo_research-${VERSION}-py3-none-any.whl" \
            "atlasrepo_research-${VERSION}.tar.gz" \
            "atlasrepo-research-${VERSION}-source.spdx.json" \
            "atlasrepo-research-${VERSION}-image-digest.txt" \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release asset provenance
        if: steps.identity.outputs.release_state != 'published_exact'
