              "immutable": True,
          }
          actual_state = {key: release.get(key) for key in expected_state}
          if actual_state != expected_state:
              raise SystemExit(f"immutable release metadata is not exact: {actual_state!r}")
          published_at = release.get("published_at")
          if not isinstance(published_at, str) or not published_at:
              raise SystemExit("immutable release has no publication timestamp")

          expected_names = {
              "SHA256SUMS",
              f"atlasrepo-research-{version}-image-digest.txt",
              f"atlasrepo-research-{version}-source.spdx.json",
              f"atlasrepo_research-{version}-py3-none-any.whl",
              f"atlasrepo_research-{version}.tar.gz",
          }
          entries = sorted(asset_root.iterdir())
          if any(not path.is_file() for path in entries):
              raise SystemExit("dist contains a non-file entry")
          local = {
              path.name: (
                  path.stat().st_size,
                  f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}",
              )
              for path in entries
          }
          if set(local) != expected_names:
