              for path in entries
          }
          if set(local) != expected_names:
              raise SystemExit(f"local release asset set is not exact: {sorted(local)!r}")

          if not isinstance(asset_pages, list) or any(not isinstance(page, list) for page in asset_pages):
              raise SystemExit("draft release asset pagination response is invalid")
          assets = [asset for page in asset_pages for asset in page]
          if any(not isinstance(asset, dict) for asset in assets):
              raise SystemExit("draft release asset pagination contains an invalid asset")
          remote_names = [asset.get("name") for asset in assets]
          if len(remote_names) != len(set(remote_names)):
              raise SystemExit("draft release contains duplicate asset names")
          extra = set(remote_names) - expected_names
          if extra:
              raise SystemExit(f"draft release contains extra assets: {sorted(extra)!r}")
          uploaded_names = set()
          starter_assets = []
          for asset in assets:
              name = asset["name"]
              state = asset.get("state")
              if state == "starter":
                  asset_id = asset.get("id")
                  if (
                      not isinstance(asset_id, int)
                      or isinstance(asset_id, bool)
                      or asset_id <= 0
                      or not isinstance(asset.get("size"), int)
                      or isinstance(asset.get("size"), bool)
                      or asset.get("size") != 0
                      or asset.get("digest") is not None
