            verify_asset_attestation \
              "dist/$asset_name" "https://slsa.dev/provenance/v1"
          done < dist/SHA256SUMS

          verify_asset_attestation \
            "dist/atlasrepo_research-${VERSION}-py3-none-any.whl" \
            "https://spdx.dev/Document/v2.3"
          verify_asset_attestation \
            "dist/atlasrepo_research-${VERSION}.tar.gz" \
            "https://spdx.dev/Document/v2.3"

      - name: Create or resume the exact draft and upload missing assets
        id: draft_release
        if: steps.identity.outputs.release_state != 'published_exact'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          RELEASE_NOTES: ${{ steps.identity.outputs.release_notes }}
          RELEASE_STATE: ${{ steps.identity.outputs.release_state }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          verify_remote_identity() {
            remote_tag_sha="$(
