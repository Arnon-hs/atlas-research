              git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
                "refs/tags/${GITHUB_REF_NAME}^{}" | awk 'NR == 1 { print $1 }'
            )"
            if test -z "$remote_tag_sha"; then
              remote_tag_sha="$(
                git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
