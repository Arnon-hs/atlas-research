              raise SystemExit(f"release is not the exact draft before publish: {actual_state!r}")

          expected_names = {
              "SHA256SUMS",
              f"atlasrepo-research-{version}-image-digest.txt",
              f"atlasrepo-research-{version}-source.spdx.json",
              f"atlasrepo_research-{version}-py3-none-any.whl",
              f"atlasrepo_research-{version}.tar.gz",
          }
          entries = sorted(asset_root.iterdir())
          if any(not path.is_file() for path in entries):
              raise SystemExit("dist contains a non-file entry")
          local = {
              path.name: (
                  path.stat().st_size,
                  f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}",
              )
              for path in entries
          }
          if set(local) != expected_names:
              raise SystemExit(f"local release asset set is not exact: {sorted(local)!r}")

          if not isinstance(asset_pages, list) or any(not isinstance(page, list) for page in asset_pages):
              raise SystemExit("draft release asset pagination response is invalid")
          assets = [asset for page in asset_pages for asset in page]
          if any(not isinstance(asset, dict) for asset in assets):
