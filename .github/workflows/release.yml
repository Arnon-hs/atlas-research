          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          asset_pages = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          asset_root = pathlib.Path(sys.argv[3])
